name: Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # GitHub Pages deployment base path. Update only here when hosting changes.
  FLUTTER_WEB_BASE_HREF: /JugaadKit/

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href ${{ env.FLUTTER_WEB_BASE_HREF }}

      - name: Ensure static SEO files are deployed
        run: |
          cp web/sitemap.xml build/web/sitemap.xml
          cp web/robots.txt build/web/robots.txt
          cp web/.nojekyll build/web/.nojekyll
          cp web/favicon.png build/web/favicon.png
          cp web/favicon.ico build/web/favicon.ico
          test -f build/web/sitemap.xml
          test -f build/web/robots.txt
          test -f build/web/favicon.png
          test -f build/web/favicon.ico
          grep -q '<urlset' build/web/sitemap.xml
          grep -q 'https://aj2322001.github.io/JugaadKit/data_jugaad' build/web/sitemap.xml
          grep -q 'Sitemap: https://aj2322001.github.io/JugaadKit/sitemap.xml' build/web/robots.txt
          grep -q 'favicon.png' build/web/index.html

      - name: Add SPA fallback for GitHub Pages
        run: cp build/web/index.html build/web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
