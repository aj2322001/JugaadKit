<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="google-site-verification" content="dff553f47b0f5ebf" />
  <meta
    name="description"
    content="Paste messy developer data. We'll figure it out. Decode, parse and explore JSON, Base64, JWT, and more in your browser."
  />
  <meta
    name="keywords"
    content="JSON formatter, JSON beautifier, JSON parser, JSON unescape, escaped JSON, JSON pretty print, developer tools"
  />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JugaadKit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="icon" href="favicon.ico" sizes="any">

  <title>JugaadKit — Data Jugaad | Developer Tools for the Messy Stuff</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
  <script>
    (function () {
      var path = location.pathname;
      if (path.endsWith('/data_jugaad') || path.endsWith('/data_jugaad/')) {
        var part = document.createElement('link');
        part.rel = 'preload';
        part.as = 'script';
        part.href = 'main.dart.js_1.part.js';
        document.head.appendChild(part);
      }
    })();
  </script>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #f8fafc;
    }

    @media (prefers-color-scheme: dark) {
      html,
      body {
        background: #0f172a;
      }
    }

    #jugaadkit-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 0.25s ease;
    }

    #jugaadkit-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    @media (prefers-color-scheme: dark) {
      #jugaadkit-loading {
        background: #0f172a;
        color: #e2e8f0;
      }
    }

    #jugaadkit-loading .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }

    #jugaadkit-loading .logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
    }

    #jugaadkit-loading .title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    #jugaadkit-loading .subtitle {
      font-size: 0.875rem;
      opacity: 0.72;
    }

    #jugaadkit-loading .spinner {
      width: 28px;
      height: 28px;
      margin-top: 8px;
      border: 3px solid rgba(27, 107, 147, 0.2);
      border-top-color: #1b6b93;
      border-radius: 50%;
      animation: jugaadkit-spin 0.8s linear infinite;
    }

    @media (prefers-color-scheme: dark) {
      #jugaadkit-loading .spinner {
        border-color: rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8;
      }
    }

    @keyframes jugaadkit-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="jugaadkit-loading" aria-live="polite" aria-busy="true">
    <div class="splash">
      <img class="logo" src="favicon.png" alt="" width="48" height="48">
      <div class="title">JugaadKit</div>
      <div class="subtitle">Loading…</div>
      <div class="spinner" role="progressbar" aria-label="Loading"></div>
    </div>
  </div>
  <script>
    (function () {
      var dismissed = false;

      function dismissSplash() {
        if (dismissed) {
          return;
        }
        dismissed = true;

        var splash = document.getElementById('jugaadkit-loading');
        if (!splash) {
          return;
        }

        splash.classList.add('fade-out');
        window.setTimeout(function () {
          splash.remove();
        }, 250);
      }

      // Only hide after Flutter has actually painted its first frame.
      window.addEventListener('jugaadkit-app-ready', dismissSplash);
      window.addEventListener('flutter-first-frame', dismissSplash);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
